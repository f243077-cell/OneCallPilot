# Chaos Shop releases and seeded deploy history (architecture §11, C6 deploy ledger,
# C7 telemetry).
#
# releases: one entry per release that has an image and slot containers
#   (infrastructure/compose/testbed.yml). The images read their own entry at
#   start-up, so `app_info{commit}` (C7) is the first 12 characters of
#   `commit_sha`, the same value the deploy ledger records for that release.
#   `config` is the release's non-secret slot configuration; the ledger's
#   `config_hash` is SHA-256 over it as compact JSON with sorted keys, and a test
#   checks that testbed.yml runs each slot with exactly this configuration.
# baseline: the release each service runs after `chaos reset`.
# history: the seeded deploy history that `chaos reset` writes to the ledger
#   before its `kind=reset` records. Each entry gives every C6 field except
#   `deploy_id` (generated), `kind` (= deploy) and `deployed_by` (= setup).
#   Older releases have no slots, so the runner can never roll back to them.
#
# Commit SHAs are 40-character lower-case hex. The release history is simulated,
# so they do not point at commits in this repository.
#
# Neutral naming (TB-010): release numbers, commit messages and reasons are
# visible to the agent. They must never name a fault or the tool that injects one.

