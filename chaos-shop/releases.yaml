# Chaos Shop releases (architecture §11.1, C6 deploy ledger, C7 telemetry).
#
# One entry per release that has an image and slot containers
# (infrastructure/compose/testbed.yml). The images read their own entry at
# start-up, so `app_info{commit}` (C7) is the first 12 characters of
# `commit_sha`, the same value the deploy ledger records for that release.
# Commit SHAs are full 40-character lower-case hex. The release history is
# simulated, so they do not point at commits in this repository.
# Task A1.3 adds the seeded deploy history that `chaos reset` writes to the ledger.
#
# Neutral naming (TB-010): release numbers and commit messages are visible to
# the agent. They must never name a fault or the tool that injects one.

releases:
  api:
    "1.4.0":
      commit_sha: "606c2674b8e32ec226c88019db05b426594a08f6"
      commit_message: "cart: cache price lookups"
    "1.5.0":
      commit_sha: "e56a282e7523212fea82c73f9157b41d5ba1743b"
      commit_message: "checkout: compute totals with new pricing rounding"
  worker:
