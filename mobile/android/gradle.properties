# Sized for the 16 GB integration laptop, where Docker holds up to 10 GB (CLAUDE.md §10.3).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Plugin sources live in the pub cache on C: while the build is on D:; Kotlin's
# incremental caches cannot span two drives on Windows, so build without them.
kotlin.incremental=false
