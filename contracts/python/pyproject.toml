[project]
name = "oncallpilot-contracts"
# Keep equal to contracts/VERSION (checked by tests/test_version.py).
version = "0.1.0"
description = "OnCallPilot shared contract models (Pydantic v2)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.13",
    "ruff>=0.8",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
