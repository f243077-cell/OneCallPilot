# Chaos Shop checks (TB-001..TB-010, TEST-012): lint, type-check and unit-test
# chaos-shop/ (C7 metric and log contract tests, fault behaviour) and the chaos
# CLI in chaos-shop/cli/ (ledger validity, TB-010 naming grep, inject and reset
# logic), then check that the testbed Compose file is valid and its images build.
# The live checks (tests/live, `pytest -m live`) need the running testbed and
# run on the integration host only.
#
# Path filtering (TEST-012): this workflow covers chaos-shop/, infrastructure/compose/testbed.yml.
# The trigger is deliberately NOT path-filtered, because a required check
# that never reports blocks merges. Keep the job name stable: branch
# protection requires it by name.
name: chaos-shop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos-shop:
    name: chaos-shop
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: chaos-shop
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        run: pipx install uv==0.12.7

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest (unit and contract tests)
        run: uv run pytest -q

      - name: chaos CLI - install (locked)
        working-directory: chaos-shop/cli
        run: uv sync --locked

      - name: chaos CLI - ruff, mypy, pytest
        working-directory: chaos-shop/cli
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -q

      # tools/ocp is the testbed's operator CLI (S1.1); its unit tests use a fake Docker.
      - name: ocp CLI - ruff, mypy, pytest (locked)
        working-directory: tools/ocp
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -q

      - name: Compose file is valid (dummy values from .env.example)
        working-directory: .
        run: >-
          docker compose --env-file .env.example
          --profile testbed --profile testbed-slots config --quiet

      - name: cs-lb nginx config is valid
        working-directory: .
        run: >-
          docker run --rm --entrypoint nginx
          -v "$PWD/chaos-shop/lb/nginx.conf:/etc/nginx/nginx.conf:ro"
          nginx:1.30.5-alpine -t

      # On failure the last lines also go to an ::error:: annotation, which the
      # public checks API shows (job logs need repository admin rights).
      - name: Images build (every release)
        working-directory: .
        run: |
          versions="$(docker version --format 'Docker {{.Server.Version}} API {{.Server.APIVersion}}'); $(docker compose version); $(docker buildx version 2>&1 || true)"
          echo "::notice title=build tools::$versions"
          set +e
          docker compose --progress plain --env-file .env.example \
            --profile testbed --profile testbed-slots build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 25 build.log | tr '\n' ' ' | sed 's/^/::error title=compose build failed::/'
            echo
          fi
          exit "$status"
