# Runner checks (TEST-012, CLAUDE.md §4.4): ruff, mypy --strict and the unit
# tests of runner/, and the runner image builds. Covers runner/ and
# infrastructure/compose/runner.yml.
#
# The trigger is deliberately NOT path-filtered, because a required check
# that never reports blocks merges. Keep the job name stable, since branch
# protection requires it by name.
#
# The runner-proxy job runs the socket-proxy-rw security test (TEST-015,
# RUN-017) against the real proxy: GitHub-hosted runners have Docker and the
# host socket, so the proxy starts and the test container reaches it.
# The runner-live job runs `pytest -m live`: the runner image against a
# throwaway Redis (A2.1), and its dry runs against the real testbed through
# socket-proxy-rw (A2.3, RUN-007), with the TEST-ONLY values of .env.example.
name: runner

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    name: runner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runner
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        run: pipx install uv==0.12.7

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest (unit tests, fake Redis) with the coverage floor (TEST-001, >= 85 %)
        run: uv run pytest -q --cov=oncallpilot_runner --cov-report=term --cov-fail-under=85

      - name: Runner image builds
        working-directory: .
        run: docker build --build-context contracts=contracts -t oncallpilot/runner:ci runner

  runner-proxy:
    name: runner-proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Dummy env (socket-proxy-rw reads only its own non-secret vars)
        run: cp .env.example .env

      # TEST-015, RUN-017: through the real socket-proxy-rw, only container reads,
      # start, stop, restart and kill are allowed; everything else is 403. The
      # script derives the API version from the host's `docker version`.
      - name: Proxy security test
        run: bash runner/tests/security/run_proxy_test.sh

  runner-live:
    name: runner-live
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        run: pipx install uv==0.12.7

      - name: Dummy env (TEST-ONLY values from .env.example)
        run: cp .env.example .env

      # Builds the testbed images, starts the stack (socket-proxy-rw included)
      # and runs `chaos reset`, which seeds the deploy ledger.
      - name: Stack up
        run: uv run --project tools/ocp ocp up

      - name: Runner image
        run: docker build --build-context contracts=contracts -t oncallpilot/runner:0.1.0 runner

      # RUN-007: each dry run changes nothing (containers, ledger, Redis keys,
      # caches), and the proxy log of the dry runs holds only GET requests.
      - name: Live tests (A2.1 runner, A2.3 dry runs)
        working-directory: runner
        run: uv run pytest -m live -v -p no:cacheprovider

      - name: Stack state on failure
        if: failure()
        run: |
          docker ps -a --format '{{.Names}} {{.Status}}'
          docker logs --tail 50 oncallpilot-socket-proxy-rw-1 || true
