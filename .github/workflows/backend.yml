# Backend checks (B1.2-B1.4; TEST-012): lint, format, strict type-check, unit tests
# (backend/tests: auth, error envelope, routes with fakes), then the
# integration suite (tests/integration: backend-api against a real
# pgvector/pgvector Postgres, a fake Redis and a local JWKS). CI never calls
# Supabase, an LLM, or FCM (CLAUDE.md §7).
#
# Path filtering (TEST-012): this workflow covers backend/, tests/integration/, tests/agent_regression/.
# The trigger is deliberately NOT path-filtered, because a required check
# that never reports blocks merges. Keep the job name stable.
name: backend

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      OCP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      OCP_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CLAUDE.md 5.8: a prompt that exists on main is never edited; a change needs
      # a new prompts/v{N}/ folder (and manifest entry). manifest.json itself is
      # checked against the files by tests/agent/test_prompts.py.
      - name: Prompt versions are immutable
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No base commit to compare with; skipping."
            exit 0
          fi
          changed="$(git diff --name-status --no-renames "$BASE_SHA" HEAD -- 'backend/oncallpilot/agent/prompts/v*/' | grep -v '^A' || true)"
          if [ -n "$changed" ]; then
            echo "::error title=prompt edited::Prompt versions are immutable; add a new version folder:"
            echo "$changed"
            exit 1
          fi

      - name: Install uv
        run: pipx install uv==0.12.7

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check . ../tests/integration ../tests/security ../tests/agent_regression

      - name: Ruff format
        run: uv run ruff format --check . ../tests/integration ../tests/security ../tests/agent_regression

      - name: Mypy (strict)
        run: |
          uv run mypy
          uv run mypy ../tests/integration
          uv run mypy ../tests/security
          MYPYPATH=../tests/integration uv run mypy ../tests/agent_regression

      - name: Pytest (unit tests)
        run: uv run pytest -q tests --cov=oncallpilot.agent --cov=oncallpilot.approvals

      - name: Pytest (integration, Postgres and Redis)
        run: uv run pytest -c pyproject.toml ../tests/integration -q --cov=oncallpilot.agent --cov=oncallpilot.approvals --cov-append

      # TEST-002: the 8 scenarios replayed through the real pipeline with FakeProvider
      # (synthetic tool outputs until B2.6 records them from the testbed).
      - name: Agent regression suite (TEST-002)
        run: uv run pytest -c pyproject.toml ../tests/agent_regression -q --cov=oncallpilot.agent --cov-append

      # The database-backed agent effects are covered by the integration suite,
      # so the floor applies to unit + integration together.
      - name: Agent coverage floor (>= 85 %, CLAUDE.md 7)
        run: uv run coverage report --include='*/agent/*' --fail-under=85

      - name: Approvals coverage floor (>= 90 %, CLAUDE.md 7)
        run: uv run coverage report --include='*/approvals/*' --fail-under=90

      # SEC-004 (a throwaway copilot-redis from infrastructure/redis/, published on
      # 127.0.0.1 for the test only) and TEST-008 (the redaction corpus).
      - name: Security tests (SEC-001, SEC-004, TEST-008)
        run: uv run pytest -c pyproject.toml ../tests/security -q

      - name: Backend image builds
        working-directory: .
        run: >-
          docker build --build-context contracts=contracts --build-context targets=runner
          --build-context runbooks=runbooks -t oncallpilot/backend:ci backend

      # TEST-015 (ro half), SEC-014: only reads through socket-proxy-ro (ADR-21).
      - name: socket-proxy-ro security test
        working-directory: .
        run: |
          cp .env.example .env
          bash tests/security/run_ro_proxy_test.sh

      - name: Observability stack starts healthy (B1.5)
        working-directory: .
        run: |
          docker compose --profile obs up -d --wait --wait-timeout 180
          docker compose --profile obs ps
          docker compose --profile obs down -v

      - name: copilot-redis starts healthy through Compose (dummy values)
        working-directory: .
        run: |
          cp .env.example .env
          docker compose --profile copilot up -d --wait --wait-timeout 60 copilot-redis
          docker compose --profile copilot down
