[project]
name = "oncallpilot-bench"
version = "0.1.0"
description = "bench: the OnCallPilot benchmark harness (BENCH-001…013, docs/phases.md B3.6–B3.7)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "matplotlib>=3.9",
    "oncallpilot-contracts",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
bench = "bench.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.uv.sources]
oncallpilot-contracts = { path = "../contracts/python", editable = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "bench"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["bench", "tests"]
