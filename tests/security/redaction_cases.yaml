# TEST-008: redaction corpus for backend/oncallpilot/agent/redaction.py (SEC-008, §7.8).
#
# Every value is FAKE. `<<N>>` expands to N characters of a mixed-case
# alphanumeric filler at test time, so this file never contains anything that
# looks like a real credential (secret scanners, CLAUDE.md 4.6).
#
# positive: `text` must become exactly `expect`.
# negative: `text` must come back unchanged.

positive:
  # --- database and Redis URLs with credentials ---
  - text: "connect postgresql://shop:hunter2@cs-postgres:5432/shop failed"
    expect: "connect postgresql://[REDACTED]@cs-postgres:5432/shop failed"
  - text: "postgres://ocp_backend.ref:<<24>>@aws-0-eu.pooler.supabase.com:5432/postgres"
    expect: "postgres://[REDACTED]@aws-0-eu.pooler.supabase.com:5432/postgres"
  - text: "REDIS=redis://runner:change-me-runner@copilot-redis:6379/0"
    expect: "REDIS=redis://[REDACTED]@copilot-redis:6379/0"
  - text: "rediss://:<<32>>@cache.example:6380"
    expect: "rediss://[REDACTED]@cache.example:6380"
  - text: "mongodb+srv://admin:pw@cluster0.example.net/db"
    expect: "mongodb+srv://[REDACTED]@cluster0.example.net/db"
  - text: "amqp://guest:guest@rabbit:5672/"
    expect: "amqp://[REDACTED]@rabbit:5672/"
  # --- JWTs and bearer tokens ---
  - text: "token eyJ<<20>>.eyJ<<30>>.<<43>> rejected"
    expect: "token [REDACTED:jwt] rejected"
  - text: "eyJhbGciOiJFUzI1NiJ9.eyJzdWIiOiIxMjMifQ.<<40>>"
    expect: "[REDACTED:jwt]"
  - text: "Authorization: Bearer <<40>>"
    expect: "Authorization: [REDACTED:bearer]"
  - text: "header authorization=bearer abc.def-ghi_jkl"
    expect: "header authorization=[REDACTED:bearer]"
  - text: "BEARER <<16>>"
    expect: "[REDACTED:bearer]"
  # --- provider keys ---
  - text: "using sk-ant-api03-<<40>> for claude"
    expect: "using [REDACTED:key] for claude"
  - text: "OPENAI sk-<<32>>"
    expect: "OPENAI [REDACTED:key]"
  - text: "key AIza<<35>> loaded"
    expect: "key [REDACTED:key] loaded"
  - text: "pushed with ghp_<<36>>"
    expect: "pushed with [REDACTED:key]"
  - text: "github_pat_<<22>>_<<59>>"
    expect: "[REDACTED:key]"
  - text: "aws AKIAABCDEFGHIJKLMNOP region eu"
    expect: "aws [REDACTED:key] region eu"
  # --- key=value secrets (env, query string, command line) ---
  - text: "password=hunter2"
    expect: "password=[REDACTED:secret]"
  - text: "GET /login?user=bob&password=hunter2&next=/"
    expect: "GET /login?user=bob&password=[REDACTED:secret]&next=/"
  - text: "passwd=abc123 retry"
    expect: "passwd=[REDACTED:secret] retry"
  - text: "secret=s3cr3t"
    expect: "secret=[REDACTED:secret]"
  - text: "?token=abcdef123456&x=1"
    expect: "?token=[REDACTED:secret]&x=1"
  - text: "api_key=<<20>>"
    expect: "api_key=[REDACTED:secret]"
  - text: "apikey = 'quoted value'"
    expect: "apikey = [REDACTED:secret]"
  - text: "ACTION_SIGNING_KEY=<<64>>"
    expect: "ACTION_SIGNING_KEY=[REDACTED:secret]"
  - text: "export RUNNER_LINK_KEY=deadbeef"
    expect: "export RUNNER_LINK_KEY=[REDACTED:secret]"
  - text: "CHAOS_TOKEN=\"abc def\""
    expect: "CHAOS_TOKEN=[REDACTED:secret]"
  - text: "CS_POSTGRES_PASSWORD=pw1 CS_REDIS_PASSWORD=pw2"
    expect: "CS_POSTGRES_PASSWORD=[REDACTED:secret] CS_REDIS_PASSWORD=[REDACTED:secret]"
  - text: "client_secret=xyz"
    expect: "client_secret=[REDACTED:secret]"
  - text: "STRIPE_SECRET=sk_test_like"
    expect: "STRIPE_SECRET=[REDACTED:secret]"
  # --- JSON and repr pairs, and key: value ---
  - text: "{\"user\": \"bob\", \"password\": \"hunter2\"}"
    expect: "{\"user\": \"bob\", \"password\": \"[REDACTED:secret]\"}"
  - text: "{'api_key': 'abc', 'n': 1}"
    expect: "{'api_key': \"[REDACTED:secret]\", 'n': 1}"
  - text: "{\"INGEST_TOKEN\":\"x1\"}"
    expect: "{\"INGEST_TOKEN\":\"[REDACTED:secret]\"}"
  - text: "{\"db_password\": 12345}"
    expect: "{\"db_password\": \"[REDACTED:secret]\"}"
  - text: "password: hunter2"
    expect: "password: [REDACTED:secret]"
  - text: "SUPABASE_SERVICE_ROLE_KEY: <<40>>"
    expect: "SUPABASE_SERVICE_ROLE_KEY: [REDACTED:secret]"
  # --- emails ---
  - text: "order for alice@example.com failed"
    expect: "order for [REDACTED:email] failed"
  - text: "to=bob.smith+shop@mail.example.co.uk"
    expect: "to=[REDACTED:email]"
  - text: "<carol_99@sub.domain.org>"
    expect: "<[REDACTED:email]>"
  # --- long base64 blobs ---
  - text: "cookie session=<<48>>; path=/"
    expect: "cookie session=[REDACTED:blob]; path=/"
  - text: "payload QWxhZGRpbjpvcGVuIHNlc2FtZQ<<20>>=="
    expect: "payload [REDACTED:blob]"
  - text: "cert MIIB<<60>>/+<<10>>"
    expect: "cert [REDACTED:blob]"
  # --- several in one line ---
  - text: "user alice@example.com token=abc Bearer <<20>> at redis://u:p@h:1"
    expect: "user [REDACTED:email] token=[REDACTED:secret] [REDACTED:bearer] at redis://[REDACTED]@h:1"
  - text: "{\"msg\": \"login\", \"email\": \"dave@example.com\", \"secret\": \"x\"}"
    expect: "{\"msg\": \"login\", \"email\": \"[REDACTED:email]\", \"secret\": \"[REDACTED:secret]\"}"
  - text: "Traceback: ConnectionError postgresql://shop:pw@cs-postgres/shop password=pw"
    expect: "Traceback: ConnectionError postgresql://[REDACTED]@cs-postgres/shop password=[REDACTED:secret]"

