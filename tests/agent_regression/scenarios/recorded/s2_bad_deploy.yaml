  gather:
  - - tool: query_logs
      args:
        service: api
        level: ERROR
    - tool: get_recent_deploys
      args:
        service: api
  - - tool: query_metrics
      args:
        template: error_rate
        service: api
  hypotheses:
    hypotheses:
    - rank: 1
      root_cause_category: bad_deploy
      confidence: 0.88
      evidence_refs:
      - E3
      - E4
      - E2
      summary: Release 1.5.0, deployed 20 s before the errors began, breaks checkout
    - rank: 2
      root_cause_category: application_bug
      confidence: 0.35
      evidence_refs:
      - E2
      summary: A latent checkout bug triggered by unusual traffic
  disproof:
    target_rank: 1
    tool: get_service_health
    params:
      service: api
    expectation_if_true: Only the 1.5.0 slot runs; 1.4.0 is stopped
  reflection:
    items:
    - rank: 1
      citations_supported: true
      adjusted_confidence: 0.86
      note: deploy precedes errors
    - rank: 2
      citations_supported: true
      adjusted_confidence: 0.3
      note: no other trigger
    top_verdict: survived
  proposal:
    action: rollback_deploy
    params:
      service: api
      target_release: 1.4.0
    expected_effect: Checkout errors stop once 1.4.0 serves traffic
    rationale: Errors began right after 1.5.0 was deployed (E3) and all come from checkout (E2, E4).
    evidence_refs:
    - E3
    - E4
expect:
  phase: PROPOSED
  action: rollback_deploy
  params:
    service: api
    target_release: 1.4.0
