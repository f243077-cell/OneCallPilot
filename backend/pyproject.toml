[project]
name = "oncallpilot-backend"
version = "0.1.0"
description = "OnCallPilot backend: backend-api and backend-worker (one image, two processes)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "oncallpilot-contracts",
    "pydantic-settings>=2.6,<3",
    "pyjwt[crypto]>=2.10,<3",
    "pyyaml>=6.0,<7",
    "redis>=6.0,<9",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "asyncpg-stubs>=0.30",
    "jsonschema>=4.23",
    "types-jsonschema",
    "pytest-timeout>=2.4.0",
    "types-pyyaml>=6.0.12.20260906",
    "pytest-cov>=7.1",
]

[tool.uv.sources]
oncallpilot-contracts = { path = "../contracts/python", editable = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "oncallpilot"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A hung WebSocket test fails instead of blocking CI.
timeout = 60
timeout_method = "thread"
markers = [
    "db: needs a Postgres with pgvector (OCP_TEST_DATABASE_URL); tests/db and tests/integration",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["../tests/db/*.py", "../tests/integration/*.py", "../tests/security/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["oncallpilot", "tests"]
