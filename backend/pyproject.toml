[project]
name = "oncallpilot-backend"
version = "0.1.0"
description = "OnCallPilot backend: backend-api and backend-worker (one image, two processes)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "asyncpg-stubs>=0.30",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "oncallpilot"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: needs a Postgres with pgvector (OCP_TEST_DATABASE_URL); tests/db and tests/integration",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["../tests/db/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
packages = ["oncallpilot", "tests"]
