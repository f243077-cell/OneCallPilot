# The intended `runner` service (architecture §2.10, §7.3; RUN-016, CLAUDE.md §4.8).
#
# The isolation spec: tests/test_isolation.py checks that it and the real
# `runner` service in infrastructure/compose/runner.yml satisfy the policy and
# agree, and runs every loosening against it. The live stack
# (tests/live/stack.py) runs the image with the same settings, which
# tests/live/test_live_limits.py checks with `docker inspect`.
#
# SAFETY: never loosen any line below. No Docker socket; Docker only through
# socket-proxy-rw. No DATABASE_URL, LLM keys, FCM credentials, INGEST_TOKEN or
# Supabase keys (§7.3).

runner:
  image: oncallpilot/runner:0.1.0
  user: "10001:10001"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 128m
  networks: [rw_proxy_net, copilot_net, chaos_net]
  volumes:
    - deploy_ledger:/ledger  # rw: the runner appends rollback and scale records
  environment:
    RUNNER_REDIS_URL: ${RUNNER_REDIS_URL}
    ACTION_SIGNING_KEY: ${ACTION_SIGNING_KEY}
    RUNNER_LINK_KEY: ${RUNNER_LINK_KEY}
    LEDGER_PATH: /ledger/deploys.jsonl
    DOCKER_HOST: tcp://socket-proxy-rw:2375
    DOCKER_API_VERSION: ${DOCKER_API_VERSION}
    RUNNER_ADMIN_TOKEN: ${RUNNER_ADMIN_TOKEN}
  restart: unless-stopped
