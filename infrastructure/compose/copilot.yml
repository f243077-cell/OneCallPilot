# Owner: Tanzeel (Stream B). Copilot services (architecture §2.2, §2.3, §2.7, §3, §12.1).
# B1.3 adds copilot-redis; B1.4 adds backend-seed (profile `tools`, run once by
# `ocp seed-incident`, never by `ocp up`). backend-api and backend-worker are
# added once a database exists (they need the Supabase project; `ocp up` must
# keep working on main without it).
#
# SAFETY (SEC-004): ACL users only (default is off); the runner user reaches only
# ocp:runner:*. copilot-redis is never published on the host.

services:
  copilot-redis:
    image: redis:7.4.11-alpine
    profiles: [copilot]
    entrypoint: ["/bin/sh", "/etc/ocp/start-redis.sh"]
    environment:
      REDIS_URL: ${REDIS_URL}
      RUNNER_REDIS_URL: ${RUNNER_REDIS_URL}
    volumes:
      - ../redis/users.acl:/etc/ocp/users.acl.template:ro
      - ../redis/start-redis.sh:/etc/ocp/start-redis.sh:ro
    user: "999:1000"
    read_only: true
    tmpfs:
      - /run/ocp:uid=999,gid=1000,mode=0700
      - /data:uid=999,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [copilot_net]
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/ocp/healthcheck.pw)\" redis-cli --user backend ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # One-off: `ocp seed-incident <timeline>` runs `python -m oncallpilot.seed` here
  # with the timeline folder mounted at /timelines. Not a long-running service,
  # so it has no healthcheck and no restart policy.
  backend-seed:
    image: oncallpilot/backend:0.1.0
    build:
      context: ../../backend
      additional_contexts:
        contracts: ../../contracts
    profiles: [tools]
    entrypoint: ["python", "-m", "oncallpilot.seed"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    # copilot_net for copilot-redis; default for the Supabase pooler on the internet.
    networks: [copilot_net, default]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    depends_on:
      copilot-redis: {condition: service_healthy}

networks:
  copilot_net:
    # Internal: no internet egress. Members: copilot-redis, and later
    # backend-api, backend-worker and the runner (architecture §3).
    internal: true
